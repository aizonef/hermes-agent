name: Build Hermes Web

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build --workspace web

      - name: Find build output
        shell: pwsh
        run: |
          Write-Host "Searching build output..."
          Get-ChildItem -Path . -Recurse -Directory -Filter web_dist

      - name: Stage artifact directory
        shell: bash
        run: |
          set -e
          rm -rf staged
          mkdir staged
          cp -r hermes_cli/web_dist/. staged/
          echo "Staged contents:"
          ls -la staged/

      - name: Compute web UI source content hash
        shell: bash
        run: |
          set -e
          HASH=$(python scripts/compute_web_ui_hash.py . web)
          if [[ ! "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid hash output: $HASH" >&2
            exit 1
          fi
          echo "CONTENT_HASH=$HASH" >> "$GITHUB_ENV"
          echo "Computed hash: $HASH"

      - name: Write build stamp into artifact
        shell: bash
        run: |
          set -e
          cat > staged/web-ui-build-stamp.json <<EOF
          {
            "contentHash": "$CONTENT_HASH",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Wrote stamp:"
          cat staged/web-ui-build-stamp.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: staged
          if-no-files-found: error
          retention-days: 7
