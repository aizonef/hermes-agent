name: Build Hermes Web

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build --workspace web

      - name: Find build output
        shell: pwsh
        run: |
          Write-Host "Searching build output..."
          Get-ChildItem -Path . -Recurse -Directory -Filter web_dist

      - name: Stage artifact directory
        shell: bash
        run: |
          set -e
          rm -rf staged
          mkdir staged
          cp -r hermes_cli/web_dist/. staged/
          echo "Staged contents:"
          ls -la staged/

      - name: Compute web UI source content hash
        shell: bash
        run: |
          set -e
          HASH_LOG=$(mktemp)
          HASH=""
          for cmd in "py" "python" "python3"; do
            echo "Trying: $cmd scripts/compute_web_ui_hash.py . web"
            HASH=$($cmd scripts/compute_web_ui_hash.py . web 2>>"$HASH_LOG")
            echo "Output: $HASH"
            if [[ "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
              echo "OK with $cmd"
              break
            fi
            HASH=""
          done
          if [ -z "$HASH" ]; then
            echo "All python attempts failed. Diagnostic log:"
            cat "$HASH_LOG"
            ls -la scripts/ 2>&1 || true
            which py python python3 2>&1 || true
            exit 1
          fi
          echo "CONTENT_HASH=$HASH" >> "$GITHUB_ENV"
          echo "Computed hash: $HASH"
          if [[ ! "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid hash output: $HASH" >&2
            exit 1
          fi
          echo "CONTENT_HASH=$HASH" >> "$GITHUB_ENV"
          echo "Computed hash: $HASH"

      - name: Write build stamp into artifact
        shell: bash
        run: |
          set -e
          cat > staged/web-ui-build-stamp.json <<EOF
          {
            "contentHash": "$CONTENT_HASH",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Wrote stamp:"
          cat staged/web-ui-build-stamp.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: staged
          if-no-files-found: error
          retention-days: 7
