name: Build Hermes Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build --workspace web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
