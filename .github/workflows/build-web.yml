name: Build Hermes Web

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install || npm install -g --force

      - run: npm run build:hermes-web

      - name: Stage artifact directory
        shell: pwsh
        run: |
          if (Test-Path staged) { Remove-Item staged -Recurse -Force }
          New-Item -ItemType Directory -Path staged | Out-Null
          Copy-Item -Path 'hermes_cli/web_dist/*' -Destination staged -Recurse -Force
          Write-Host "Staged artifact contents:"
          Get-ChildItem -Recurse staged | Select-Object -First 20

      - name: Compute web UI source content hash
        shell: pwsh
        run: |
          python scripts/compute_web_ui_hash.py . web | Tee-Object -Variable hashOut | Write-Host
          $hash = $hashOut.Trim()
          if ($hash -notmatch '^[0-9a-f]{64}$') {
            Write-Error "Invalid hash output: '$hash'"
            exit 1
          }
          "CONTENT_HASH=$hash" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          Write-Host "Set CONTENT_HASH=$hash"

      - name: Write build stamp into artifact
        shell: pwsh
        run: |
          $stamp = @{
            contentHash = $env:CONTENT_HASH
            builtAt     = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 5
          $stampPath = 'staged/web-ui-build-stamp.json'
          $stamp | Out-File -Encoding utf8 $stampPath
          Write-Host "Wrote stamp to $stampPath"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: staged
          if-no-files-found: error
          retention-days: 7
