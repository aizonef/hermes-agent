name: Build Hermes Web

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build --workspace web

      - name: Find build output
        shell: pwsh
        run: |
          Write-Host "Searching build output..."
          Get-ChildItem -Path . -Recurse -Directory -Filter web_dist

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: hermes_cli/web_dist
