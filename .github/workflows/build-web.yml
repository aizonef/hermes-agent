name: Build Hermes Web

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build --workspace web

      - name: Find build output
        shell: pwsh
        run: |
          Write-Host "Searching build output..."
          Get-ChildItem -Path . -Recurse -Directory -Filter web_dist

      - name: Stage artifact directory
        shell: bash
        run: |
          set -e
          rm -rf staged
          mkdir staged
          cp -r hermes_cli/web_dist/. staged/
          echo "Staged contents:"
          ls -la staged/

      - name: Compute web UI source content hash
        shell: bash
        run: |
          set -e
          HASH=$(echo "" | base64 -d | python3 - 2>/dev/null)
          if [ -z "$HASH" ]; then
            echo "Inline python3 failed; trying py / python / python3 with helper script"
            HASH=$(py scripts/compute_web_ui_hash.py . web 2>/dev/null || \
                   python scripts/compute_web_ui_hash.py . web 2>/dev/null || \
                   python3 scripts/compute_web_ui_hash.py . web) || HASH=""
          fi
          if [ -z "$HASH" ]; then
            echo "All hash strategies failed"
            exit 1
          fi
          echo "Computed hash: $HASH"
          echo "CONTENT_HASH=$HASH" >> "$GITHUB_ENV"
      - name: Write build stamp into artifact
        shell: bash
        run: |
          set -e
          cat > staged/web-ui-build-stamp.json <<EOF
          {
            "contentHash": "$CONTENT_HASH",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Wrote stamp:"
          cat staged/web-ui-build-stamp.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: staged
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-log
          path: |
            ${{ env.HASH_LOG }}
            staged/web-ui-build-stamp.json
            staged/
          if-no-files-found: ignore
          retention-days: 1
